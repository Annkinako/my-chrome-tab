<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChromeTab</title>
<style>
:root{color-scheme:dark;--x-logo:50%;--y-logo:31%;--x-search:50%;--y-search:48%}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans JP",sans-serif}
body{background:#10131a;color:white}
#background,#imageBackground{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;display:none;pointer-events:none}
#shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.20),rgba(0,0,0,.28));z-index:-2;pointer-events:none}
#logo{position:absolute;left:var(--x-logo);top:var(--y-logo);transform:translate(-50%,-50%);font-size:clamp(48px,7vw,88px);font-weight:600;letter-spacing:-5px;cursor:grab;user-select:none;text-shadow:0 2px 18px #0008;white-space:nowrap}
#logo span:nth-child(1),#logo span:nth-child(4){color:#4285f4}
#logo span:nth-child(2),#logo span:nth-child(6){color:#ea4335}
#logo span:nth-child(3){color:#fbbc05}
#logo span:nth-child(5){color:#34a853}
#searchWrap{position:absolute;left:var(--x-search);top:var(--y-search);transform:translate(-50%,-50%);width:min(min(650px,88vw),92vw);cursor:grab}
#searchForm{height:56px;display:flex;align-items:center;gap:12px;border-radius:32px;background:#fff;color:#5f6368;padding:0 18px;box-shadow:0 5px 24px #0002}
#searchForm svg{flex:none;width:22px;height:22px}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#202124;font-size:16px}
#q::placeholder{color:#777}
#go{border:0;background:transparent;color:#5f6368;cursor:pointer;font-size:14px;padding:8px}
#hint{position:fixed;left:14px;bottom:14px;font-size:12px;color:#fff;background:#0007;padding:8px 11px;border-radius:10px;opacity:.9}
#menuBtn{position:fixed;right:16px;bottom:16px;border:1px solid #ffffff50;border-radius:50%;width:44px;height:44px;background:#171717bb;color:white;font-size:21px;cursor:pointer;backdrop-filter:blur(10px)}
#panel{position:fixed;right:16px;bottom:70px;width:min(340px,calc(100vw - 32px));max-height:calc(100vh - 100px);overflow:auto;padding:16px;border:1px solid #ffffff30;border-radius:16px;background:#171a20ed;backdrop-filter:blur(16px);box-shadow:0 12px 40px #0006;display:none}
#panel.open{display:block}
#panel h2{font-size:16px;margin:0 0 12px}
#panel p{font-size:12px;line-height:1.6;color:#d2d5dc;margin:8px 0 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button,.actions label{display:inline-flex;align-items:center;justify-content:center;border:1px solid #ffffff35;border-radius:9px;padding:9px 11px;color:white;background:#ffffff12;cursor:pointer;font-size:13px}
input[type=file]{display:none}
@media(max-width:480px){#logo{letter-spacing:-3px}#searchForm{height:50px;padding:0 14px}#hint{max-width:75vw}}
</style>
</head>
<body>
<video id="background" autoplay muted loop playsinline></video>
<img id="imageBackground" alt="" aria-hidden="true">
<div id="shade"></div>

<div id="logo" class="draggable" aria-label="Google logo" title="ドラッグして移動"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>

<div id="searchWrap" class="draggable" title="バーの端をドラッグして移動">
<form id="searchForm" action="https://www.google.com/search" method="get">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
<input id="q" name="q" autocomplete="off" placeholder="Google で検索または URL を入力" aria-label="Google検索">
<button id="go" type="submit">検索</button>
</form>
</div>

<div id="hint">ロゴ・検索バーはドラッグで移動できます</div>
<button id="menuBtn" aria-label="設定を開く" title="設定">⚙</button>

<section id="panel" aria-label="設定">
<h2>カスタマイズ</h2>
<p>ロゴや検索バーをドラッグして位置を調整できます。位置はこのブラウザに保存されます。</p>
<div class="actions">
<label for="backgroundFile">背景画像・GIF・動画を選ぶ</label>
<input id="backgroundFile" type="file" accept="image/*,.gif,video/*">
<button id="clearBackground" type="button">背景を消す</button>
<button id="reset" type="button">位置をリセット</button>
<button id="hidePanel" type="button">閉じる</button>
</div>
<p>画像（JPG・PNG・WebPなど）、アニメーションGIF、動画を選べます。選んだ背景はこのブラウザに保存され、次回も表示されるようにします。大きなファイルは保存できない場合があります。</p>
</section>

<script>
(()=>{
const root=document.documentElement,logo=document.getElementById('logo'),search=document.getElementById('searchWrap');
const menu=document.getElementById('menuBtn'),panel=document.getElementById('panel');
const video=document.getElementById('background'),img=document.getElementById('imageBackground'),fileInput=document.getElementById('backgroundFile');
const defaults={logo:[50,31],search:[50,48]};

function apply(key,pos){root.style.setProperty('--x-'+key,pos[0]+'%');root.style.setProperty('--y-'+key,pos[1]+'%')}
function save(key,pos){try{localStorage.setItem('myTab-'+key,JSON.stringify(pos))}catch(e){}}
function load(key){try{const v=JSON.parse(localStorage.getItem('myTab-'+key));if(Array.isArray(v)&&v.length===2&&v.every(Number.isFinite))return v}catch(e){}return defaults[key]}

apply('logo',load('logo'));
apply('search',load('search'));

function makeDraggable(el,key){
let active=null;
el.addEventListener('pointerdown',e=>{
if(e.target.closest('input,button'))return;
active={id:e.pointerId,startX:e.clientX,startY:e.clientY,rect:el.getBoundingClientRect(),moved:false};
el.setPointerCapture(e.pointerId);
el.style.cursor='grabbing';
});
el.addEventListener('pointermove',e=>{
if(!active||active.id!==e.pointerId)return;
const dx=e.clientX-active.startX,dy=e.clientY-active.startY;
if(Math.abs(dx)+Math.abs(dy)>3)active.moved=true;
const x=Math.max(4,Math.min(96,(active.rect.left+active.rect.width/2+dx)/innerWidth*100));
const y=Math.max(7,Math.min(93,(active.rect.top+active.rect.height/2+dy)/innerHeight*100));
apply(key,[x,y]);
});
const end=e=>{
if(!active||active.id!==e.pointerId)return;
const x=parseFloat(getComputedStyle(root).getPropertyValue('--x-'+key));
const y=parseFloat(getComputedStyle(root).getPropertyValue('--y-'+key));
if(active.moved)save(key,[x,y]);
active=null;
el.style.cursor='grab';
};
el.addEventListener('pointerup',end);
el.addEventListener('pointercancel',end);
}

makeDraggable(logo,'logo');
makeDraggable(search,'search');

menu.addEventListener('click',()=>panel.classList.toggle('open'));
document.getElementById('hidePanel').addEventListener('click',()=>panel.classList.remove('open'));

document.getElementById('reset').addEventListener('click',()=>{
for(const k of ['logo','search']){
apply(k,defaults[k]);
save(k,defaults[k]);
}
});

function showBackground(dataUrl,type){
video.pause();
video.removeAttribute('src');
video.load();
video.style.display='none';
img.removeAttribute('src');
img.style.display='none';

if(type.startsWith('video/')){
video.src=dataUrl;
video.style.display='block';
video.play().catch(()=>{});
}else{
img.src=dataUrl;
img.style.display='block';
}
}

function clearBackground(){
video.pause();
video.removeAttribute('src');
video.load();
video.style.display='none';
img.removeAttribute('src');
img.style.display='none';
try{localStorage.removeItem('myTab-background')}catch(e){}
}

fileInput.addEventListener('change',async e=>{
const file=e.target.files&&e.target.files[0];
if(!file)return;

const isVideo=file.type.startsWith('video/');
const limit=isVideo?12*1024*1024:8*1024*1024;

if(file.size>limit){
alert(isVideo?'動画は12MB以下のファイルを選んでください。':'画像・GIFは8MB以下のファイルを選んでください。');
fileInput.value='';
return;
}

try{
const dataUrl=await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=()=>reject(new Error('read failed'));
reader.readAsDataURL(file);
});

showBackground(dataUrl,file.type||'image/gif');

try{
localStorage.setItem('myTab-background',JSON.stringify({dataUrl,type:file.type||'image/gif'}));
}catch(err){
alert('背景は表示できますが、保存容量が足りず、次回は選び直す必要があるかもしれません。');
}
}catch(err){
alert('ファイルを読み込めませんでした。別のファイルを試してください。');
}
fileInput.value='';
});

document.getElementById('clearBackground').addEventListener('click',clearBackground);

try{
const saved=JSON.parse(localStorage.getItem('myTab-background'));
if(saved&&typeof saved.dataUrl==='string'&&typeof saved.type==='string')showBackground(saved.dataUrl,saved.type);
}catch(e){}

document.getElementById('searchForm').addEventListener('submit',e=>{
if(!document.getElementById('q').value.trim()){
e.preventDefault();
document.getElementById('q').focus();
}
});
})();
</script>
</body>
</html>
